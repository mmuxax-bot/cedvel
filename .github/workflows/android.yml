name: Web to APK Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Kodu yüklə
      uses: actions/checkout@v4
      
    - name: Node.js quraşdır
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Asılılıqları yüklə (npm install)
      run: npm install
      
    - name: Veb saytı derlə (Vite build)
      run: npm run build
      
    - name: Capacitor Quraşdır və Android layihəsi yarat
      run: |
        npm install @capacitor/core @capacitor/cli @capacitor/android
        npx cap init "Nibras App" "com.nibras.app" --web-dir dist
        npx cap add android
        npx cap sync android
        
    - name: Java JDK quraşdır
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        
    - name: APK Derlə (Gradle)
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug
        
    - name: Hazır APK-nı Yüklə
      uses: actions/upload-artifact@v4
      with:
        name: nibras-app-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
