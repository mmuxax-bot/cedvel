name: Android CI/CD (Native Flutter)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.22.2'
        channel: 'stable'
        
    - name: Asılılıqları Yüklə
      run: flutter pub get
      
    - name: Gradle Faylını Python ilə Düzəlt
      run: |
        python3 -c "
        file_path = 'android/app/build.gradle'
        with open(file_path, 'r') as f:
            content = f.read()
        
        # Kitabxana pluginini tətbiq plugininə çeviririk
        content = content.replace('com.android.library', 'com.android.application')
        content = content.replace('id \"com.android.library\"', 'id \"com.android.application\"')
        
        with open(file_path, 'w') as f:
            f.write(content)
        print('build.gradle uğurla yeniləndi!')
        "
        
    - name: APK Derlə
      run: flutter build apk --release
      
    - name: Hazır APK-nı Yüklə
      uses: actions/upload-artifact@v4
      with:
        name: nibras-native-apk
        path: build/app/outputs/flutter-apk/app-release.apk
