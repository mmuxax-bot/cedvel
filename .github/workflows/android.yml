name: Android CI/CD (Native Flutter)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.22.2'
        channel: 'stable'
        
    - name: Asılılıqları Yüklə
      run: flutter pub get
      
    - name: Təmiz və İşlək build.gradle Yarat
      run: |
        # Problemli köhnə build.gradle faylını silib təmiz tətbiq faylı yaradırıq
        rm -f android/app/build.gradle
        
        cat << 'EOT' > android/app/build.gradle
        plugins {
            id "com.android.application"
            id "kotlin-android"
            id "dev.flutter.flutter-gradle-plugin"
        }

        android {
            namespace "com.example.cedvel"
            compileSdkVersion flutter.compileSdkVersion
            ndkVersion flutter.ndkVersion

            compileOptions {
                sourceCompatibility JavaVersion.VERSION_1_8
                targetCompatibility JavaVersion.VERSION_1_8
            }

            kotlinOptions {
                jvmTarget = '1.8'
            }

            defaultConfig {
                applicationId "com.example.cedvel"
                minSdkVersion flutter.minSdkVersion
                targetSdkVersion flutter.targetSdkVersion
                versionCode flutterVersionCode.toInteger()
                versionName flutterVersionName
            }

            buildTypes {
                release {
                    signingConfig signingConfigs.debug
                    shrinkResources false
                    minifyEnabled false
                }
            }
        }

        flutter {
            source '../..'
        }
        EOT
        
        echo "Yeni build.gradle uğurla yaradıldı!"
        
    - name: APK Derlə
      run: flutter build apk --release
      
    - name: Hazır APK-nı Yüklə
      uses: actions/upload-artifact@v4
      with:
        name: nibras-native-apk
        path: build/app/outputs/flutter-apk/app-release.apk
