name: Android CI/CD (Native Flutter)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.22.2'
        channel: 'stable'
        
    - name: Asılılıqları Yüklə
      run: flutter pub get
      
    - name: Gradle Faylını Debug Et və Düzəlt
      run: |
        python3 -c "
        import os
        path = 'android/app/build.gradle'
        if os.path.exists(path):
            with open(path, 'r') as f:
                lines = f.readlines()
            
            print('--- İLK 15 SƏTİR ---')
            for l in lines[:15]:
                print(l, end='')
            print('--------------------')
            
            new_lines = []
            for line in lines:
                # Kitabxana pluginini tətbiq plugininə çeviririk
                line = line.replace('com.android.library', 'com.android.application')
                new_lines.append(line)
                
            with open(path, 'w') as f:
                f.writelines(new_lines)
            print('Fayl yenidən yazıldı.')
        else:
            print('Fayl tapılmadı!')
        "
        
    - name: APK Derlə
      run: flutter build apk --release
      
    - name: Hazır APK-nı Yüklə
      uses: actions/upload-artifact@v4
      with:
        name: nibras-native-apk
        path: build/app/outputs/flutter-apk/app-release.apk
